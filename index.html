<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hindi Word (.docx) & Text Font Converter</title>
  <!-- Tailwind CSS & JSZip -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    @font-face {
      font-family: 'Kruti Dev 010';
      src: url('https://raw.githubusercontent.com/manojbits/kruti-dev-010-font/master/Kruti_Dev_010.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    .font-kruti {
      font-family: 'Kruti Dev 010', 'KrutiDev010', 'Kruti Dev', sans-serif !important;
    }
    .font-mangal {
      font-family: 'Mangal', 'Nirmala UI', 'Noto Sans Devanagari', sans-serif !important;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-indigo-900 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
      <div>
        <h1 class="text-xl md:text-2xl font-bold tracking-tight">Hindi Document & Font Converter</h1>
        <p class="text-xs md:text-sm text-indigo-200">Lossless MS Word (.docx) & Text Converter (Mangal ⇄ Kruti Dev 010)</p>
      </div>
      <div class="flex items-center gap-2">
        <label for="fontUpload" class="text-xs bg-indigo-800 hover:bg-indigo-700 border border-indigo-600 px-3 py-1.5 rounded cursor-pointer transition">
          Load Local .TTF
        </label>
        <input type="file" id="fontUpload" accept=".ttf,.otf" class="hidden">
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

    <!-- Document Upload Card -->
    <div class="bg-white border-2 border-dashed border-indigo-200 rounded-xl p-6 text-center hover:border-indigo-400 transition shadow-sm">
      <div class="flex flex-col items-center justify-center space-y-3">
        <svg class="w-12 h-12 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        <div>
          <label for="wordFileInput" class="cursor-pointer font-semibold text-indigo-700 hover:text-indigo-900 underline text-base">
            Upload Word Document (.docx)
          </label>
          <span class="text-sm text-slate-500"> or drag and drop here</span>
          <input type="file" id="wordFileInput" accept=".docx,.txt" class="hidden">
        </div>
        <p class="text-xs text-slate-400">All tables, alignments, borders, column widths, and cell margins are 100% preserved.</p>
      </div>

      <!-- File Status Badge -->
      <div id="fileStatusContainer" class="hidden mt-4 pt-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3 text-left">
        <div>
          <span class="text-xs font-semibold px-2.5 py-1 rounded bg-indigo-50 text-indigo-700 border border-indigo-200" id="fileNameBadge">document.docx</span>
          <span class="text-xs text-slate-500 ml-2" id="fileSizeBadge"></span>
        </div>
        <button id="downloadWordBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs px-4 py-2 rounded-lg shadow transition flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          Download Converted .docx
        </button>
      </div>
    </div>

    <!-- Mode Selector & Controls -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Direction:</span>
        <select id="conversionMode" class="bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none font-medium">
          <option value="mangal2kruti">Mangal (Unicode) ➔ Kruti Dev 010</option>
          <option value="kruti2mangal">Kruti Dev 010 ➔ Mangal (Unicode)</option>
        </select>
        <button id="swapDirectionBtn" title="Swap direction" class="p-1.5 rounded-lg border border-slate-300 hover:bg-slate-100 text-slate-600">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
        </button>
      </div>

      <div class="flex items-center gap-2">
        <button id="convertTextBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-xs px-4 py-2 rounded-lg shadow-sm transition">
          Convert Text
        </button>
        <button id="clearBtn" class="border border-slate-300 hover:bg-slate-50 text-slate-600 text-xs px-3 py-2 rounded-lg transition">
          Clear
        </button>
      </div>
    </div>

    <!-- Dual-Pane Editor -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Left: Source Box -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-96">
        <div class="px-4 py-2.5 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-xl">
          <span class="text-xs font-semibold text-slate-600" id="sourceLabel">Mangal (Unicode) Input</span>
          <span class="text-[11px] text-slate-400" id="srcCounter">0 chars</span>
        </div>
        <textarea id="srcText" placeholder="Type or paste Hindi Unicode (Mangal) text here..." class="w-full flex-1 p-4 resize-none focus:outline-none font-mangal text-sm text-slate-800 leading-relaxed"></textarea>
      </div>

      <!-- Right: Target Box -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-96">
        <div class="px-4 py-2.5 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-xl">
          <span class="text-xs font-semibold text-slate-600" id="targetLabel">Kruti Dev 010 Output</span>
          <div class="flex items-center gap-3">
            <label class="flex items-center gap-1.5 text-[11px] text-slate-500 cursor-pointer">
              <input type="checkbox" id="renderKrutiToggle" checked class="rounded text-indigo-600 focus:ring-0">
              Visual Hindi
            </label>
            <button id="copyBtn" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">Copy</button>
          </div>
        </div>
        <textarea id="targetText" readonly placeholder="Converted text appears here..." class="w-full flex-1 p-4 resize-none focus:outline-none font-kruti text-sm text-slate-800 leading-relaxed"></textarea>
      </div>
    </div>

  </main>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-lg shadow-lg opacity-0 transition-opacity pointer-events-none z-50"></div>

  <!-- Converter Logic Script -->
  <script>
    // --- Precise Unicode Devanagari ➔ Kruti Dev 010 Engine ---
    function unicodeToKrutiDev(input) {
      if (!input) return "";

      let text = input;

      // 1. Preserve English numbers and dotted section numbering (e.g., 1.1, 1.1.1, 10.2)
      // We protect them using temporary tokens so the engine doesn't turn '.' into 'º' or 'o'
      const protectedNumbers = [];
      text = text.replace(/(\b\d+(\.\d+)+\b)/g, (match) => {
        protectedNumbers.push(match);
        return `___SEC_NUM_${protectedNumbers.length - 1}___`;
      });

      // 2. Standardize hyphens and dashes to normal ASCII hyphen
      text = text.replace(/[\u2010\u2013\u2014\u2212]/g, "-");

      // 3. Common Devanagari Ligatures and Multi-character Conjuncts
      const ligatures = [
        ["्र", "z"],
        ["द्द", "í"],
        ["द्ध", "DoubleDha_TEMP"], // placeholder
        ["द्घ", "I"],
        ["द्म", "n"],
        ["द्य", "|"],
        ["द्व", "DoubleVa_TEMP"],
        ["क्त", "Dr_TEMP"],
        ["क्ष", "X"],
        ["ज्ञ", "K"],
        ["त्र", "="],
        ["श्र", "J"]
      ];

      // 4. Precomposed Nukta Letters
      text = text.replace(/ड़/g, "M+");
      text = text.replace(/ढ़/g, "<+");
      text = text.replace(/फ़/g, "Q+");
      text = text.replace(/ज़/g, "t+");
      text = text.replace(/ख़/g, "[k+");
      text = text.replace(/ग़/g, "x+");

      // 5. Shift 'Reph' (र्) to Kruti Dev 'Z' after syllable
      // Match 'र्' followed by consonant + matras
      text = text.replace(/र्([\u0915-\u0939]्)*[\u0915-\u0939](\u093e|\u0940|\u0941|\u0942|\u0947|\u0948|\u094b|\u094c|\u0902)?/g, (match) => {
        let base = match.substring(2);
        return base + "Z";
      });

      // 6. Handle Chhoti-ee Matra ('ि' -> 'f') Shift to the LEFT of consonant/cluster
      // Matches consonant clusters followed by 'ि'
      text = text.replace(/((?:[\u0915-\u0939]्)*[\u0915-\u0939])ि/g, "f$1");

      // 7. Base Consonants & Vowels Mapping
      const map = [
        ["अं", "vka"], ["अः", "vk%"], ["आ", "vk"], ["अ", "v"],
        ["इ", "b"], ["ई", "bZ"], ["उ", "m"], ["ऊ", "Å"],
        ["ऋ", "_"], ["ए", ",s"], ["ऐ", "Ss"], ["ओ", "vks"], ["औ", "vkS"],

        ["क", "d"], ["ख", "[k"], ["ग", "x"], ["घ", "?k"], ["ङ", "³"],
        ["च", "p"], ["छ", "N"], ["ज", "t"], ["झ", "Pk"], ["ञ", "¥"],
        ["ट", "V"], ["ठ", "B"], ["ड", "M"], ["ढ", "<"], ["ण", ".k"],
        ["त", "r"], ["थ", "Fk"], ["द", "n"], ["ध", "/k"], ["न", "u"],
        ["प", "i"], ["फ", "Q"], ["ब", "c"], ["भ", "Hk"], ["म", "e"],
        ["य", "Search_Y"], ["र", "j"], ["ल", "y"], ["व", "o"],
        ["श", "'k"], ["ष", "\"k"], ["स", "l"], ["ह", "g"],

        // Half Consonants (Halant forms)
        ["क्", "D"], ["ख्", "["], ["ग्", "X"], ["घ्", "?"],
        ["च्", "P"], ["छ्", "N्"], ["ज्", "T"], ["झ्", "P"],
        ["त्", "R"], ["थ्", "F"], ["द्", "í"], ["ध्", "/"], ["न्", "U"],
        ["प्", "I"], ["फ्", "Q"], ["ब्", "C"], ["भ्", "H"], ["म्", "E"],
        ["ल्", "Y"], ["व्", "O"], ["श्", "'"], ["ष्", "\""], ["स्", "L"],

        // Matras
        ["ा", "k"], ["ी", "h"], ["ु", "q"], ["ू", "w"],
        ["ृ", "`"], ["े", "s"], ["ै", "S"], ["ो", "ks"], ["ौ", "kS"],
        ["ं", "a"], ["ः", "%"], ["ँ", "¡"], ["्", "d्"], ["ऽ", "S"]
      ];

      // Fix specific placeholders
      map.forEach(([k, v]) => {
        text = text.split(k).join(v);
      });

      // Special conjunct restore
      text = text.replace(/Search_Y/g, "य");
      text = text.replace(/DoubleDha_TEMP/g, "द्ध");
      text = text.replace(/DoubleVa_TEMP/g, "द्व");
      text = text.replace(/Dr_TEMP/g, "Dr");

      // Laghu / Abbreviations (क्र०सं० -> Ø0la0)
      text = text.replace(/क्र०/g, "Ø0");
      text = text.replace(/सं०/g, "la0");
      text = text.replace(/०/g, "0");

      // Restore protected numbers
      protectedNumbers.forEach((val, idx) => {
        text = text.replace(`___SEC_NUM_${idx}___`, val);
      });

      return text;
    }

    // --- Precise Kruti Dev 010 ➔ Unicode (Mangal) Engine ---
    function krutiDevToUnicode(input) {
      if (!input) return "";

      let text = input;

      // 1. Protect dotted numbering
      const protectedNumbers = [];
      text = text.replace(/(\b\d+(\.\d+)+\b)/g, (match) => {
        protectedNumbers.push(match);
        return `___SEC_NUM_${protectedNumbers.length - 1}___`;
      });

      // Fix known Alt symbols & ordinal degrees
      text = text.replace(/º/g, ".");
      text = text.replace(/¼/g, "(");
      text = text.replace(/½/g, ")");

      // 2. Chhoti-ee matra ('f') invert back to right-side 'ि'
      // 'f' followed by half consonants and base consonant
      text = text.replace(/f([D\[X?PTR/UIECY'\"L]?)([d[kx?k³pNtPk¥VB<k.krFknd/kuiQcbHkeyov'k\"klgh])/g, "$1$2ि");
      text = text.replace(/f(.)/g, "$1ि");

      // 3. Reph 'Z' shift back to front of syllable
      text = text.replace(/([a-zA-Z\u0900-\u097F]+)Z/g, "र्$1");

      // 4. Character mappings
      const k2u = [
        ["Ø0", "क्र०"], ["la0", "सं०"],
        ["'k", "श"], ["\"k", "ष"], ["' ", "श "], ["'", "श्"], ["\"", "ष्"],
        ["J", "श्र"], ["K", "ज्ञ"], ["X", "क्ष"], ["=", "त्र"],
        ["vkS", "औ"], ["vks", "ओ"], ["Ss", "ऐ"], [",s", "ए"], ["vk", "आ"], ["v", "अ"],
        ["bZ", "ई"], ["b", "इ"], ["Å", "ऊ"], ["m", "उ"], ["_", "ऋ"],
        ["[k+", "ख़"], ["x+", "ग़"], ["t+", "ज़"], ["M+", "ड़"], ["<+", "ढ़"], ["Q+", "फ़"],
        ["[k", "ख"], ["?k", "घ"], ["Pk", "झ"], [".k", "ण"], ["Fk", "थ"], ["/k", "ध"],
        ["Hk", "भ"], ["d", "क"], ["x", "ग"], ["³", "ङ"], ["p", "च"], ["N", "छ"],
        ["t", "ज"], ["¥", "ञ"], ["V", "ट"], ["B", "ठ"], ["M", "ड"], ["<", "ढ"],
        ["r", "त"], ["n", "द"], ["u", "न"], ["i", "प"], ["Q", "फ"], ["c", "ब"],
        ["e", "म"], ["j", "र"], ["y", "ल"], ["o", "व"], ["l", "स"], ["g", "ह"],
        ["D", "क्"], ["[", "ख्"], ["X", "ग्"], ["?", "घ्"], ["P", "च्"], ["T", "ज्"],
        ["R", "त्"], ["F", "थ्"], ["í", "द्"], ["/", "ध्"], ["U", "न्"], ["I", "प्"],
        ["C", "ब्"], ["H", "भ्"], ["E", "म्"], ["Y", "ल्"], ["O", "व्"], ["L", "स्"],
        ["kS", "ौ"], ["ks", "ो"], ["S", "ै"], ["s", "े"], ["k", "ा"], ["h", "ी"],
        ["q", "ु"], ["w", "ू"], ["`", "ृ"], ["a", "ं"], ["%", "ः"], ["¡", "ँ"],
        ["0", "०"]
      ];

      k2u.forEach(([k, v]) => {
        text = text.split(k).join(v);
      });

      // Restore protected numbers
      protectedNumbers.forEach((val, idx) => {
        text = text.replace(`___SEC_NUM_${idx}___`, val);
      });

      // Canonical Unicode Normalization (prevents broken nuktas & spacers)
      return text.normalize("NFC");
    }

    // --- DOM Elements & State ---
    const srcText = document.getElementById("srcText");
    const targetText = document.getElementById("targetText");
    const modeSelect = document.getElementById("conversionMode");
    const swapBtn = document.getElementById("swapDirectionBtn");
    const convertBtn = document.getElementById("convertTextBtn");
    const clearBtn = document.getElementById("clearBtn");
    const copyBtn = document.getElementById("copyBtn");
    const renderToggle = document.getElementById("renderKrutiToggle");
    const srcLabel = document.getElementById("sourceLabel");
    const targetLabel = document.getElementById("targetLabel");
    const srcCounter = document.getElementById("srcCounter");

    const wordInput = document.getElementById("wordFileInput");
    const fileContainer = document.getElementById("fileStatusContainer");
    const fileNameBadge = document.getElementById("fileNameBadge");
    const fileSizeBadge = document.getElementById("fileSizeBadge");
    const downloadDocxBtn = document.getElementById("downloadWordBtn");
    const fontUpload = document.getElementById("fontUpload");

    let currentConvertedDocxZip = null;
    let originalDocxName = "converted.docx";

    // --- Live Conversion ---
    function doConvert() {
      const mode = modeSelect.value;
      const text = srcText.value;
      if (mode === "mangal2kruti") {
        targetText.value = unicodeToKrutiDev(text);
      } else {
        targetText.value = krutiDevToUnicode(text);
      }
      srcCounter.textContent = `${srcText.value.length} chars`;
    }

    srcText.addEventListener("input", doConvert);
    convertBtn.addEventListener("click", doConvert);

    // --- Mode Change & Swap ---
    function updateModeUI() {
      if (modeSelect.value === "mangal2kruti") {
        srcLabel.textContent = "Mangal (Unicode) Input";
        targetLabel.textContent = "Kruti Dev 010 Output";
        srcText.className = "w-full flex-1 p-4 resize-none focus:outline-none font-mangal text-sm text-slate-800 leading-relaxed";
        if (renderToggle.checked) {
          targetText.className = "w-full flex-1 p-4 resize-none focus:outline-none font-kruti text-sm text-slate-800 leading-relaxed";
        } else {
          targetText.className = "w-full flex-1 p-4 resize-none focus:outline-none font-mono text-sm text-slate-800 leading-relaxed";
        }
      } else {
        srcLabel.textContent = "Kruti Dev 010 Input";
        targetLabel.textContent = "Mangal (Unicode) Output";
        srcText.className = "w-full flex-1 p-4 resize-none focus:outline-none font-kruti text-sm text-slate-800 leading-relaxed";
        targetText.className = "w-full flex-1 p-4 resize-none focus:outline-none font-mangal text-sm text-slate-800 leading-relaxed";
      }
      doConvert();
    }

    modeSelect.addEventListener("change", updateModeUI);
    swapBtn.addEventListener("click", () => {
      modeSelect.value = modeSelect.value === "mangal2kruti" ? "kruti2mangal" : "mangal2kruti";
      const temp = srcText.value;
      srcText.value = targetText.value;
      targetText.value = temp;
      updateModeUI();
    });

    renderToggle.addEventListener("change", () => {
      if (modeSelect.value === "mangal2kruti") {
        targetText.className = renderToggle.checked
          ? "w-full flex-1 p-4 resize-none focus:outline-none font-kruti text-sm text-slate-800 leading-relaxed"
          : "w-full flex-1 p-4 resize-none focus:outline-none font-mono text-sm text-slate-800 leading-relaxed";
      }
    });

    clearBtn.addEventListener("click", () => {
      srcText.value = "";
      targetText.value = "";
      srcCounter.textContent = "0 chars";
    });

    copyBtn.addEventListener("click", () => {
      if (!targetText.value) return;
      navigator.clipboard.writeText(targetText.value).then(() => showToast("Copied to clipboard!"));
    });

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.remove("opacity-0");
      setTimeout(() => toast.classList.add("opacity-0"), 2500);
    }

    // --- Font Local Upload ---
    fontUpload.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const font = new FontFace("Kruti Dev 010", event.target.result);
          font.load().then((loadedFont) => {
            document.fonts.add(loadedFont);
            showToast("Custom Kruti Dev font loaded successfully!");
          });
        };
        reader.readAsArrayBuffer(file);
      }
    });

    // --- DOCX OpenXML Processing (Strict Font Injection) ---
    wordInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      originalDocxName = file.name;
      fileNameBadge.textContent = file.name;
      fileSizeBadge.textContent = `(${(file.size / 1024).toFixed(1)} KB)`;
      fileContainer.classList.remove("hidden");

      if (file.name.endsWith(".txt")) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          srcText.value = ev.target.result;
          doConvert();
        };
        reader.readAsText(file);
        return;
      }

      showToast("Processing Word document XML...");

      try {
        const arrayBuffer = await file.arrayBuffer();
        const zip = await JSZip.loadAsync(arrayBuffer);
        const mode = modeSelect.value;
        const targetFont = mode === "mangal2kruti" ? "Kruti Dev 010" : "Mangal";

        const xmlTargetFiles = Object.keys(zip.files).filter(filename => 
          filename.startsWith("word/") && (
            filename.endsWith(".xml") || 
            filename.includes("document") || 
            filename.includes("header") || 
            filename.includes("footer")
          )
        );

        let extractedPreview = "";

        for (const fileName of xmlTargetFiles) {
          const xmlContent = await zip.file(fileName).async("string");
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(xmlContent, "application/xml");

          // 1. Process all run elements <w:r>
          const runs = xmlDoc.getElementsByTagName("w:r");
          for (let i = 0; i < runs.length; i++) {
            const run = runs[i];
            const tNode = run.getElementsByTagName("w:t")[0];

            if (tNode && tNode.textContent) {
              const origText = tNode.textContent;
              const converted = mode === "mangal2kruti" ? unicodeToKrutiDev(origText) : krutiDevToUnicode(origText);
              tNode.textContent = converted;

              if (extractedPreview.length < 1500) {
                extractedPreview += converted + " ";
              }

              // Update run properties to force Kruti Dev / Mangal
              let rPr = run.getElementsByTagName("w:rPr")[0];
              if (!rPr) {
                rPr = xmlDoc.createElement("w:rPr");
                run.insertBefore(rPr, run.firstChild);
              }

              let rFonts = rPr.getElementsByTagName("w:rFonts")[0];
              if (!rFonts) {
                rFonts = xmlDoc.createElement("w:rFonts");
                rPr.appendChild(rFonts);
              }

              // Enforce font across ALL slots: ascii, hAnsi, cs, and eastAsia
              rFonts.setAttribute("w:ascii", targetFont);
              rFonts.setAttribute("w:hAnsi", targetFont);
              rFonts.setAttribute("w:cs", targetFont);
              rFonts.setAttribute("w:eastAsia", targetFont);

              // Remove RTL or complex script flags that make Word force Mangal
              const rtlNode = rPr.getElementsByTagName("w:rtl")[0];
              if (rtlNode) rPr.removeChild(rtlNode);
              const csNode = rPr.getElementsByTagName("w:cs")[0];
              if (csNode && mode === "mangal2kruti") rPr.removeChild(csNode);
            }
          }

          // Serialize back into the ZIP
          const serializer = new XMLSerializer();
          const modifiedXml = serializer.serializeToString(xmlDoc);
          zip.file(fileName, modifiedXml);
        }

        currentConvertedDocxZip = zip;
        targetText.value = extractedPreview.trim();
        showToast("Word document converted! Ready to download.");
      } catch (err) {
        console.error(err);
        showToast("Error processing .docx file structure.");
      }
    });

    // --- Download Modified DOCX ---
    downloadDocxBtn.addEventListener("click", async () => {
      if (!currentConvertedDocxZip) {
        showToast("No converted document available to download.");
        return;
      }
      showToast("Generating .docx file...");
      const blob = await currentConvertedDocxZip.generateAsync({ type: "blob" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Converted_${originalDocxName}`;
      link.click();
      URL.revokeObjectURL(link.href);
      showToast("Download started!");
    });
  </script>
</body>
</html>
