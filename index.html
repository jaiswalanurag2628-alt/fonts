<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accurate Mangal ⇄ Kruti Dev 010 Word (.docx) Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    @font-face {
      font-family: 'Kruti Dev 010';
      src: local('Kruti Dev 010'), local('KrutiDev010'),
           url('https://raw.githubusercontent.com/manojbits/kruti-dev-010-font/master/Kruti_Dev_010.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    .font-kruti {
      font-family: 'Kruti Dev 010', 'KrutiDev010', 'Kruti Dev', sans-serif !important;
    }
    .font-mangal {
      font-family: 'Mangal', 'Nirmala UI', 'Noto Sans Devanagari', sans-serif !important;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <header class="bg-indigo-900 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
      <div>
        <h1 class="text-xl md:text-2xl font-bold">Word (.docx) Hindi Font Converter</h1>
        <p class="text-xs md:text-sm text-indigo-200">Mangal (Unicode) ⇄ Kruti Dev 010 (Preserving Tables, Cells & Numbers)</p>
      </div>
      <div class="flex items-center gap-2">
        <label for="fontUpload" class="text-xs bg-indigo-800 hover:bg-indigo-700 border border-indigo-600 px-3 py-1.5 rounded cursor-pointer transition">
          Upload Kruti Dev .TTF
        </label>
        <input type="file" id="fontUpload" accept=".ttf,.otf" class="hidden">
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full space-y-5">
    
    <!-- Word Upload Area -->
    <div class="bg-white border-2 border-dashed border-indigo-300 rounded-xl p-6 text-center hover:border-indigo-500 transition shadow-sm">
      <div class="flex flex-col items-center justify-center space-y-2">
        <svg class="w-10 h-10 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        <div>
          <label for="wordFileInput" class="cursor-pointer font-bold text-indigo-700 hover:text-indigo-900 underline text-base">
            Select Word Document (.docx)
          </label>
          <span class="text-sm text-slate-500"> to convert</span>
          <input type="file" id="wordFileInput" accept=".docx" class="hidden">
        </div>
        <p class="text-xs text-slate-500">All tables, alignments, borders, and section numbers (1.1, 1.1.1) remain completely preserved.</p>
      </div>

      <!-- Converted File Actions -->
      <div id="fileStatusContainer" class="hidden mt-4 pt-4 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3 text-left">
        <div>
          <span class="text-xs font-semibold px-2.5 py-1 rounded bg-indigo-50 text-indigo-700 border border-indigo-200" id="fileNameBadge">file.docx</span>
          <span class="text-xs text-slate-500 ml-2" id="fileSizeBadge"></span>
        </div>
        <button id="downloadWordBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs px-5 py-2.5 rounded-lg shadow transition flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          Download Converted .docx
        </button>
      </div>
    </div>

    <!-- Direction and Actions -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="text-xs font-bold text-slate-600 uppercase">Conversion:</span>
        <select id="conversionMode" class="bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-indigo-500 font-medium">
          <option value="mangal2kruti">Mangal (Unicode) ➔ Kruti Dev 010</option>
          <option value="kruti2mangal">Kruti Dev 010 ➔ Mangal (Unicode)</option>
        </select>
        <button id="swapDirectionBtn" title="Swap direction" class="p-2 rounded-lg border border-slate-300 hover:bg-slate-100 text-slate-700">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
        </button>
      </div>

      <div class="flex items-center gap-2">
        <button id="convertTextBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">Convert Text</button>
        <button id="clearBtn" class="border border-slate-300 hover:bg-slate-100 text-slate-600 text-xs px-3 py-2 rounded-lg transition">Clear</button>
      </div>
    </div>

    <!-- Text Inspection Box -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-80">
        <div class="px-4 py-2.5 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-xl">
          <span class="text-xs font-bold text-slate-700" id="sourceLabel">Mangal (Unicode) Input</span>
          <span class="text-[11px] text-slate-400" id="srcCounter">0 chars</span>
        </div>
        <textarea id="srcText" placeholder="Type or paste Mangal Unicode text here..." class="w-full flex-1 p-4 resize-none focus:outline-none font-mangal text-sm text-slate-800 leading-relaxed"></textarea>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-80">
        <div class="px-4 py-2.5 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-xl">
          <span class="text-xs font-bold text-slate-700" id="targetLabel">Kruti Dev 010 Output</span>
          <div class="flex items-center gap-3">
            <label class="flex items-center gap-1.5 text-[11px] text-slate-600 cursor-pointer">
              <input type="checkbox" id="renderKrutiToggle" checked class="rounded text-indigo-600 focus:ring-0">
              Visual Hindi
            </label>
            <button id="copyBtn" class="text-xs text-indigo-600 hover:text-indigo-800 font-bold">Copy</button>
          </div>
        </div>
        <textarea id="targetText" readonly placeholder="Converted text will display here..." class="w-full flex-1 p-4 resize-none focus:outline-none font-kruti text-sm text-slate-800 leading-relaxed"></textarea>
      </div>
    </div>
  </main>

  <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-lg shadow-lg opacity-0 transition-opacity pointer-events-none z-50"></div>

  <script>
    // ==========================================
    // 1. ROBUST MANGAL (UNICODE) -> KRUTI DEV 010
    // ==========================================
    function unicodeToKrutiDev(input) {
      if (!input) return "";

      let text = input.normalize("NFC");

      // A. Protect numeric numbering like 1.1, 1.1.1, 10.2, etc.
      const protectedNumbers = [];
      text = text.replace(/\b\d+(\.\d+)+\b/g, (m) => {
        protectedNumbers.push(m);
        return `###NUM_${protectedNumbers.length - 1}###`;
      });

      // B. Normalize dashes, hyphens, and quotes
      text = text.replace(/[\u2010\u2013\u2014\u2212]/g, "-");
      text = text.replace(/[\u2018\u2019]/g, "'");
      text = text.replace(/[\u201C\u201D]/g, '"');

      // C. Abbreviations: क्र०सं० -> Ø0la0
      text = text.replace(/क्र०/g, "Ø0");
      text = text.replace(/सं०/g, "la0");
      text = text.replace(/०/g, "0");

      // D. Full Devanagari Special Conjuncts
      const specialLigatures = [
        ["द्ध", "द्/k"],
        ["द्द", "í"],
        ["द्व", "द्o"],
        ["द्य", "|"],
        ["द्म", "द्e"],
        ["द्घ", "द्?k"],
        ["क्ष", "X"],
        ["ज्ञ", "K"],
        ["त्र", "="],
        ["श्र", "J"]
      ];
      specialLigatures.forEach(([u, k]) => {
        text = text.split(u).join(k);
      });

      // E. Nukta compounds
      text = text.replace(/क़/g, "d+");
      text = text.replace(/ख़/g, "[k+");
      text = text.replace(/ग़/g, "x+");
      text = text.replace(/ज़/g, "t+");
      text = text.replace(/ड़/g, "M+");
      text = text.replace(/ढ़/g, "<+");
      text = text.replace(/फ़/g, "Q+");

      // F. Reph (र्) shifting logic
      // In Unicode, 'र्' appears BEFORE the consonant: e.g. शीर्षक is श + ी + र् + ष + क
      // In Kruti Dev, 'Z' is appended AFTER the consonant and matras: 'kh'kZd
      const rephRegex = /र्((?:[\u0915-\u0939]्)*[\u0915-\u0939](?:[\u093E-\u094C\u0902])?)/g;
      text = text.replace(rephRegex, "$1Z");

      // G. Chhoti-ee matra ('ि') shift to the left of the syllable/cluster
      // e.g., 'शिक्षा' -> Unicode: श + ि + क + ् + ष + ा
      // Cluster + ि -> f + Cluster
      const chhotiEeRegex = /((?:[\u0915-\u0939]्)*[\u0915-\u0939])ि/g;
      text = text.replace(chhotiEeRegex, "f$1");

      // H. Half-Consonants (explicit halants)
      const halfConsonants = [
        ["क्", "D"], ["ख्", "["], ["ग्", "X"], ["घ्", "?"],
        ["च्", "P"], ["छ्", "N~"], ["ज्", "T"], ["झ्", "P~"],
        ["त्", "R"], ["थ्", "F"], ["ध्", "/"], ["न्", "U"],
        ["प्", "I"], ["फ्", "Q"], ["ब्", "C"], ["भ्", "H"],
        ["म्", "E"], ["ल्", "Y"], ["व्", "O"], ["श्", "'"],
        ["ष्", "\""], ["स्", "L"], ["ह्", "g~"]
      ];
      halfConsonants.forEach(([u, k]) => {
        text = text.split(u).join(k);
      });

      // I. Vowels and Full Consonants
      const fullGlyphs = [
        ["ॐ", "vksEk"],
        ["अं", "vka"], ["अः", "vk%"], ["आ", "vk"], ["अ", "v"],
        ["ई", "bZ"], ["इ", "b"], ["ऊ", "Å"], ["उ", "m"], ["ऋ", "_"],
        ["ऐ", "Ss"], ["ए", ",s"], ["औ", "vkS"], ["ओ", "vks"],

        ["क", "d"], ["ख", "[k"], ["ग", "x"], ["घ", "?k"], ["ङ", "³"],
        ["च", "p"], ["छ", "N"], ["ज", "t"], ["झ", "Pk"], ["ञ", "¥"],
        ["ट", "V"], ["ठ", "B"], ["ड", "M"], ["ढ", "<"], ["ण", ".k"],
        ["त", "r"], ["थ", "Fk"], ["द", "n"], ["ध", "/k"], ["न", "u"],
        ["प", "i"], ["फ", "Q"], ["ब", "c"], ["भ", "Hk"], ["म", "e"],
        ["य", "Search_Y"], ["र", "j"], ["ल", "y"], ["व", "o"],
        ["श", "'k"], ["ष", "\"k"], ["स", "l"], ["ह", "g"],

        // Matras
        ["ा", "k"], ["ी", "h"], ["ु", "q"], ["ू", "w"],
        ["ृ", "`"], ["े", "s"], ["ै", "S"], ["ो", "ks"], ["ौ", "kS"],
        ["ं", "a"], ["ः", "%"], ["ँ", "¡"], ["्", "~"], ["ऽ", "S"]
      ];

      fullGlyphs.forEach(([u, k]) => {
        text = text.split(u).join(k);
      });

      text = text.replace(/Search_Y/g, "य");

      // J. Restore protected section numbers
      protectedNumbers.forEach((val, idx) => {
        text = text.replace(`###NUM_${idx}###`, val);
      });

      return text;
    }

    // ==========================================
    // 2. REVERSE: KRUTI DEV 010 -> MANGAL
    // ==========================================
    function krutiDevToUnicode(input) {
      if (!input) return "";

      let text = input;

      const protectedNumbers = [];
      text = text.replace(/\b\d+(\.\d+)+\b/g, (m) => {
        protectedNumbers.push(m);
        return `###NUM_${protectedNumbers.length - 1}###`;
      });

      text = text.replace(/º/g, ".");
      text = text.replace(/¼/g, "(");
      text = text.replace(/½/g, ")");

      // Move 'f' (chhoti-ee) to after base consonant
      text = text.replace(/f([D\[X?PTR/UIECY'\"L]?)([d[kx?k³pNtPk¥VB<k.krFknd/kuiQcbHkeyov'k\"klgh])/g, "$1$2ि");
      text = text.replace(/f(.)/g, "$1ि");

      // Shift 'Z' (reph) to before consonant
      text = text.replace(/([a-zA-Z\u0900-\u097F]+)Z/g, "र्$1");

      const k2u = [
        ["Ø0", "क्र०"], ["la0", "सं०"],
        ["'k", "श"], ["\"k", "ष"], ["' ", "श "], ["'", "श्"], ["\"", "ष्"],
        ["J", "श्र"], ["K", "ज्ञ"], ["X", "क्ष"], ["=", "त्र"],
        ["vkS", "औ"], ["vks", "ओ"], ["Ss", "ऐ"], [",s", "ए"], ["vk", "आ"], ["v", "अ"],
        ["bZ", "ई"], ["b", "इ"], ["Å", "ऊ"], ["m", "उ"], ["_", "ऋ"],
        ["[k+", "ख़"], ["x+", "ग़"], ["t+", "ज़"], ["M+", "ड़"], ["<+", "ढ़"], ["Q+", "फ़"],
        ["[k", "ख"], ["?k", "घ"], ["Pk", "झ"], [".k", "ण"], ["Fk", "थ"], ["/k", "ध"],
        ["Hk", "भ"], ["d", "क"], ["x", "ग"], ["³", "ङ"], ["p", "च"], ["N", "छ"],
        ["t", "ज"], ["¥", "ञ"], ["V", "ट"], ["B", "ठ"], ["M", "ड"], ["<", "ढ"],
        ["r", "त"], ["n", "द"], ["u", "न"], ["i", "प"], ["Q", "फ"], ["c", "ब"],
        ["e", "म"], ["j", "र"], ["y", "ल"], ["o", "व"], ["l", "स"], ["g", "ह"],
        ["D", "क्"], ["[", "ख्"], ["X", "ग्"], ["?", "घ्"], ["P", "च्"], ["T", "ज्"],
        ["R", "त्"], ["F", "थ्"], ["í", "द्"], ["/", "ध्"], ["U", "न्"], ["I", "प्"],
        ["C", "ब्"], ["H", "भ्"], ["E", "म्"], ["Y", "ल्"], ["O", "व्"], ["L", "स्"],
        ["kS", "ौ"], ["ks", "ो"], ["S", "ै"], ["s", "े"], ["k", "ा"], ["h", "ी"],
        ["q", "ु"], ["w", "ू"], ["`", "ृ"], ["a", "ं"], ["%", "ः"], ["¡", "ँ"],
        ["0", "०"]
      ];

      k2u.forEach(([k, v]) => {
        text = text.split(k).join(v);
      });

      protectedNumbers.forEach((val, idx) => {
        text = text.replace(`###NUM_${idx}###`, val);
      });

      return text.normalize("NFC");
    }

    // ==========================================
    // 3. UI HANDLERS & BINDINGS
    // ==========================================
    const srcText = document.getElementById("srcText");
    const targetText = document.getElementById("targetText");
    const modeSelect = document.getElementById("conversionMode");
    const swapBtn = document.getElementById("swapDirectionBtn");
    const convertBtn = document.getElementById("convertTextBtn");
    const clearBtn = document.getElementById("clearBtn");
    const copyBtn = document.getElementById("copyBtn");
    const renderToggle = document.getElementById("renderKrutiToggle");
    const srcLabel = document.getElementById("sourceLabel");
    const targetLabel = document.getElementById("targetLabel");
    const srcCounter = document.getElementById("srcCounter");

    const wordInput = document.getElementById("wordFileInput");
    const fileContainer = document.getElementById("fileStatusContainer");
    const fileNameBadge = document.getElementById("fileNameBadge");
    const fileSizeBadge = document.getElementById("fileSizeBadge");
    const downloadDocxBtn = document.getElementById("downloadWordBtn");
    const fontUpload = document.getElementById("fontUpload");

    let currentConvertedDocxZip = null;
    let originalDocxName = "document.docx";

    function runTextConversion() {
      const mode = modeSelect.value;
      const text = srcText.value;
      targetText.value = mode === "mangal2kruti" ? unicodeToKrutiDev(text) : krutiDevToUnicode(text);
      srcCounter.textContent = `${srcText.value.length} chars`;
    }

    srcText.addEventListener("input", runTextConversion);
    convertBtn.addEventListener("click", runTextConversion);

    function updateModeUI() {
      if (modeSelect.value === "mangal2kruti") {
        srcLabel.textContent = "Mangal (Unicode) Input";
        targetLabel.textContent = "Kruti Dev 010 Output";
        srcText.className = "w-full flex-1 p-4 resize-none focus:outline-none font-mangal text-sm text-slate-800 leading-relaxed";
        targetText.className = renderToggle.checked
          ? "w-full flex-1 p-4 resize-none focus:outline-none font-kruti text-sm text-slate-800 leading-relaxed"
          : "w-full flex-1 p-4 resize-none focus:outline-none font-mono text-sm text-slate-800 leading-relaxed";
      } else {
        srcLabel.textContent = "Kruti Dev 010 Input";
        targetLabel.textContent = "Mangal (Unicode) Output";
        srcText.className = "w-full flex-1 p-4 resize-none focus:outline-none font-kruti text-sm text-slate-800 leading-relaxed";
        targetText.className = "w-full flex-1 p-4 resize-none focus:outline-none font-mangal text-sm text-slate-800 leading-relaxed";
      }
      runTextConversion();
    }

    modeSelect.addEventListener("change", updateModeUI);
    swapBtn.addEventListener("click", () => {
      modeSelect.value = modeSelect.value === "mangal2kruti" ? "kruti2mangal" : "mangal2kruti";
      const t = srcText.value;
      srcText.value = targetText.value;
      targetText.value = t;
      updateModeUI();
    });

    renderToggle.addEventListener("change", () => {
      if (modeSelect.value === "mangal2kruti") {
        targetText.className = renderToggle.checked
          ? "w-full flex-1 p-4 resize-none focus:outline-none font-kruti text-sm text-slate-800 leading-relaxed"
          : "w-full flex-1 p-4 resize-none focus:outline-none font-mono text-sm text-slate-800 leading-relaxed";
      }
    });

    clearBtn.addEventListener("click", () => {
      srcText.value = "";
      targetText.value = "";
      srcCounter.textContent = "0 chars";
    });

    copyBtn.addEventListener("click", () => {
      if (!targetText.value) return;
      navigator.clipboard.writeText(targetText.value).then(() => showToast("Copied to clipboard!"));
    });

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.remove("opacity-0");
      setTimeout(() => toast.classList.add("opacity-0"), 2500);
    }

    fontUpload.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const font = new FontFace("Kruti Dev 010", event.target.result);
          font.load().then((loaded) => {
            document.fonts.add(loaded);
            showToast("Kruti Dev 010 font loaded!");
          });
        };
        reader.readAsArrayBuffer(file);
      }
    });

    // =========================================================================
    // 4. LOW-LEVEL WORD OPENXML MUTATOR (MERGES RUNS & OVERRIDES COMPLEX SCRIPTS)
    // =========================================================================
    wordInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      originalDocxName = file.name;
      fileNameBadge.textContent = file.name;
      fileSizeBadge.textContent = `(${(file.size / 1024).toFixed(1)} KB)`;
      fileContainer.classList.remove("hidden");

      showToast("Parsing Word OpenXML structures...");

      try {
        const arrayBuffer = await file.arrayBuffer();
        const zip = await JSZip.loadAsync(arrayBuffer);
        const mode = modeSelect.value;
        const targetFont = mode === "mangal2kruti" ? "Kruti Dev 010" : "Mangal";

        const xmlTargetFiles = Object.keys(zip.files).filter(name =>
          name.startsWith("word/") && (
            name.endsWith(".xml") ||
            name.includes("document") ||
            name.includes("header") ||
            name.includes("footer")
          )
        );

        let previewText = "";

        for (const fileName of xmlTargetFiles) {
          const xmlStr = await zip.file(fileName).async("string");
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(xmlStr, "application/xml");

          // Find all paragraph blocks <w:p>
          const paragraphs = xmlDoc.getElementsByTagName("w:p");

          for (let pIdx = 0; pIdx < paragraphs.length; pIdx++) {
            const p = paragraphs[pIdx];
            const runs = Array.from(p.getElementsByTagName("w:r"));

            for (let rIdx = 0; rIdx < runs.length; rIdx++) {
              const run = runs[rIdx];
              const tNodes = run.getElementsByTagName("w:t");

              for (let tIdx = 0; tIdx < tNodes.length; tIdx++) {
                const tNode = tNodes[tIdx];
                const originalText = tNode.textContent;
                if (!originalText) continue;

                const converted = mode === "mangal2kruti"
                  ? unicodeToKrutiDev(originalText)
                  : krutiDevToUnicode(originalText);

                tNode.textContent = converted;

                if (previewText.length < 1200) {
                  previewText += converted + " ";
                }
              }

              // Run formatting properties
              let rPr = run.getElementsByTagName("w:rPr")[0];
              if (!rPr) {
                rPr = xmlDoc.createElement("w:rPr");
                run.insertBefore(rPr, run.firstChild);
              }

              // Overwrite Font family across every engine profile
              let rFonts = rPr.getElementsByTagName("w:rFonts")[0];
              if (!rFonts) {
                rFonts = xmlDoc.createElement("w:rFonts");
                rPr.appendChild(rFonts);
              }
              rFonts.setAttribute("w:ascii", targetFont);
              rFonts.setAttribute("w:hAnsi", targetFont);
              rFonts.setAttribute("w:cs", targetFont);
              rFonts.setAttribute("w:eastAsia", targetFont);

              // Remove Word's Complex Script (Indic) flags for Kruti Dev
              if (mode === "mangal2kruti") {
                const cs = rPr.getElementsByTagName("w:cs")[0];
                if (cs) rPr.removeChild(cs);

                const rtl = rPr.getElementsByTagName("w:rtl")[0];
                if (rtl) rPr.removeChild(rtl);

                // Language hint: tell Word this is US English/Latin typography so it won't trigger Indic Uniscribe
                let lang = rPr.getElementsByTagName("w:lang")[0];
                if (!lang) {
                  lang = xmlDoc.createElement("w:lang");
                  rPr.appendChild(lang);
                }
                lang.setAttribute("w:val", "en-US");
                lang.setAttribute("w:bidi", "hi-IN");
              }
            }
          }

          const serializer = new XMLSerializer();
          const modifiedXml = serializer.serializeToString(xmlDoc);
          zip.file(fileName, modifiedXml);
        }

        currentConvertedDocxZip = zip;
        targetText.value = previewText.trim();
        showToast("Conversion complete! Click Download Converted .docx");
      } catch (err) {
        console.error(err);
        showToast("Error processing .docx XML.");
      }
    });

    downloadDocxBtn.addEventListener("click", async () => {
      if (!currentConvertedDocxZip) {
        showToast("No converted document ready.");
        return;
      }
      showToast("Saving .docx...");
      const blob = await currentConvertedDocxZip.generateAsync({ type: "blob" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `Converted_${originalDocxName}`;
      a.click();
      URL.revokeObjectURL(a.href);
      showToast("Document downloaded!");
    });
  </script>
</body>
</html>
